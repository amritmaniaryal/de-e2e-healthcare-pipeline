version: 2

# Staging tests pin the RENAMED key. Source tests can only check the original
# column names, so a rename slip would pass every raw test and break everything
# downstream. These are deliberately thin: keys only, no blanket coverage.

models:
  - name: stg_patients
    description: Patients, renamed to snake_case. 1,096 rows.
    columns:
      - name: patient_id
        tests: [not_null, unique]

  - name: stg_providers
    description: Providers, renamed. SPECIALITY fixed to specialty. 152 rows.
    columns:
      - name: provider_id
        tests: [not_null, unique]
      - name: npi
        tests: [not_null, unique]

  - name: stg_organizations
    description: Organisations, renamed. 152 rows.
    columns:
      - name: organization_id
        tests: [not_null, unique]

  - name: stg_payers
    description: Payers, renamed. 10 rows.
    columns:
      - name: payer_id
        tests: [not_null, unique]

  - name: stg_encounters
    description: Encounters, renamed. 57,592 rows.
    columns:
      - name: encounter_id
        tests: [not_null, unique]

  - name: stg_claims
    description: Claim headers, renamed. 97,394 rows.
    columns:
      - name: claim_id
        tests: [not_null, unique]

  - name: stg_claims_transactions
    description: Claim lines, renamed. 902,713 rows. Source key column is ID.
    columns:
      - name: claim_transaction_id
        tests: [not_null, unique]

  # The four event tables have no single-column key, so individual columns are
  # not unique -- only not_null applies. member_id is excluded on purpose: it is
  # null for every government-payer row.
  - name: stg_payer_transitions
    description: Payer membership, renamed. 37,700 rows. No primary key.
    columns:
      - name: patient_id
        tests: [not_null]
      - name: start_date
        tests: [not_null]
      - name: payer_id
        tests: [not_null]

  - name: stg_conditions
    description: Diagnoses, renamed. 34,727 rows. No primary key.
    columns:
      - name: patient_id
        tests: [not_null]
      - name: encounter_id
        tests: [not_null]
      - name: condition_code
        tests: [not_null]
      - name: started_at
        tests: [not_null]

  - name: stg_medications
    description: Prescriptions, renamed. 39,729 rows. No primary key.
    columns:
      - name: patient_id
        tests: [not_null]
      - name: encounter_id
        tests: [not_null]
      - name: payer_id
        tests: [not_null]
      - name: medication_code
        tests: [not_null]
      - name: started_at
        tests: [not_null]

  - name: stg_procedures
    description: Procedures, renamed. 151,636 rows. No primary key.
    columns:
      - name: patient_id
        tests: [not_null]
      - name: encounter_id
        tests: [not_null]
      - name: procedure_code
        tests: [not_null]
      - name: started_at
        tests: [not_null]
