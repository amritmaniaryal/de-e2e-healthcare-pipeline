version: 2

sources:
  - name: raw
    description: >
      Landing zone loaded from S3 by the healthcare_pipeline DAG. Typed by the
      Spark layer from explicit schemas, then loaded with COPY INTO.
    database: healthcare
    schema: raw

    tables:
      # Seven tables have a single-column primary key. Testing it here means a
      # broken load fails at the source, before it reaches staging or marts.
      - name: patients
        description: One row per patient. 1,096 rows.
        columns:
          - name: Id
            tests: [not_null, unique]

      - name: providers
        description: One row per provider. 152 rows. One provider per organisation.
        columns:
          - name: Id
            tests: [not_null, unique]

      - name: organizations
        description: One row per organisation. 152 rows.
        columns:
          - name: Id
            tests: [not_null, unique]

      - name: payers
        description: One row per payer. 10 rows. Address columns are blank in all of them.
        columns:
          - name: Id
            tests: [not_null, unique]

      - name: encounters
        description: Care visits. 57,592 rows.
        columns:
          - name: Id
            tests: [not_null, unique]

      - name: claims
        description: Claim headers. 97,394 rows. REFERRINGPROVIDERID is null in every row.
        columns:
          - name: Id
            tests: [not_null, unique]

      - name: claims_transactions
        description: Claim lines. 902,713 rows. Primary key is ID, uppercase.
        columns:
          # Uppercase ID -- the only table that is not Id.
          - name: ID
            tests: [not_null, unique]

      # The remaining four have no Id: they are event logs keyed on
      # (patient, encounter/environment, code, start). Individual columns are
      # therefore not unique, but each key component is non-null, so not_null
      # is the meaningful assertion. `start` is skipped on three of them
      # because it is a reserved word in Snowflake.
      - name: payer_transitions
        description: Payer membership over time. No Id. MEMBERID is null for government payers.
        columns:
          - name: PATIENT
            tests: [not_null]
          - name: START_DATE
            tests: [not_null]
          - name: PAYER
            tests: [not_null]

      - name: conditions
        description: Diagnoses. No Id.
        columns:
          - name: PATIENT
            tests: [not_null]
          - name: ENCOUNTER
            tests: [not_null]
          - name: CODE
            tests: [not_null]

      - name: medications
        description: Prescriptions. No Id.
        columns:
          - name: PATIENT
            tests: [not_null]
          - name: ENCOUNTER
            tests: [not_null]
          - name: CODE
            tests: [not_null]

      - name: procedures
        description: Procedures performed. No Id.
        columns:
          - name: PATIENT
            tests: [not_null]
          - name: ENCOUNTER
            tests: [not_null]
          - name: CODE
            tests: [not_null]
