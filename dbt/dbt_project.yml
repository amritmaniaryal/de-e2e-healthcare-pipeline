name: healthcare
version: '1.0.0'
profile: healthcare

models:
  healthcare:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # `prod` publishes into the same marts schema `dev` builds, so only `ci`
      # is prefixed. The list is explicit rather than "everything except ci" so
      # a new target has to be considered on purpose, not silently publish.
      +schema: "{{ var('marts_schema', 'marts' if target.name in ('dev', 'prod') else target.name ~ '_marts') }}"